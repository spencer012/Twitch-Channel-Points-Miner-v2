name: Twitch Channel Points Miner
version: "2.1.0-ha1"
slug: twitch_miner
description: Watches Twitch streams in the background to collect channel points.
url: https://github.com/spencer012/Twitch-Channel-Points-Miner-v2
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The miner saves state on SIGTERM; give it longer than the 10s default.
timeout: 30
ingress: true
ingress_port: 5000
panel_icon: mdi:twitch
panel_title: Twitch Miner
# Analytics is reached through Ingress. Direct LAN access stays off unless a
# host port is set under Configuration -> Network.
ports:
  5000/tcp: null
ports_description:
  5000/tcp: Analytics web UI (optional; Ingress already provides it)
map:
  # One-time import of cookies/analytics/logs from /share/twitch_miner_import.
  - type: share
    read_only: true
options:
  run_py: ""
schema:
  run_py: str
